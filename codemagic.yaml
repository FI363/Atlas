workflows:
  ipad-release:
    name: Atlas iPad Native App Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Run Flutter analyze & tests
        script: |
          flutter analyze
          flutter test
      - name: Build iOS App for iPad
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for Sideloading (AltStore / SideStore / Sideloadly)
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Atlas.ipa Payload
          mv Atlas.ipa $CM_BUILD_DIR/Atlas-iPad.ipa
    artifacts:
      - Atlas-iPad.ipa
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - user_email@example.com
        notify:
          success: true
          failure: true

  ipad-signed:
    name: Atlas iPad Signed Build (TestFlight / Ad-Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials # Define this in Codemagic UI if using Apple Developer Program
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA with Code Signing
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - user_email@example.com
        notify:
          success: true
          failure: true
